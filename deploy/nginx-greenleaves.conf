# nginx vhost for GreenLeaves static landing
# Copy to /etc/nginx/sites-available/greenleaves and enable with:
#   sudo ln -sf /etc/nginx/sites-available/greenleaves /etc/nginx/sites-enabled/greenleaves
#   sudo nginx -t && sudo systemctl reload nginx
#
# Once DNS for greenleaves.ga points to 37.60.240.199, run:
#   sudo certbot --nginx -d greenleaves.ga -d www.greenleaves.ga

server {
    # Public port on the shared server. Once DNS for greenleaves.ga points here,
    # certbot can move this to 80/443 with hostname routing.
    listen 8085;
    listen [::]:8085;
    server_name greenleaves.ga www.greenleaves.ga 37.60.240.199 _;

    root /var/www/greenleaves/public;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Security headers (basic)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long cache for images (filenames are stable — bump on update if needed)
    location ~* \.(jpg|jpeg|png|webp|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # Slightly shorter cache for CSS/JS/SVG (in case of design tweaks)
    location ~* \.(css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # HTML — no cache, always fresh
    location ~ \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # SPA-style fallback (harmless for a single-page site)
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/greenleaves.access.log;
    error_log  /var/log/nginx/greenleaves.error.log warn;
}
